version: '3.8'

services:
  oil-sif-predict:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oil_sif_predict_app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
